<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DPlayer Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css">
    <link rel="stylesheet" href="demo.css">
	
	 <script src="D:/work/learning/src/test/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs/dist/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/webtorrent/latest/webtorrent.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pearplayer"></script>
    <script src="DPlayer.min.js"></script>
</head>
<body >
<div class="markdown-body">
    <h2>在 dialog 中承载视频</h2>
    <h3 id="dplayer-dialog" class="show-dialog">Show Dialog</h3>
    <div id="float-dplayer" class="float-dplayer">
        <div id="dplayer-container" class="dplayer-container"></div>
        <h3 id="close-dialog" class="close-dialog">X</h3>
    </div>

    <h2 id="quick-start">Quick Start</h2>
    <div class="example">
        <div id="dplayer1"></div>
		<!--<video src="https://kkembed.kdwshell.com/get_file/3/279f621d34802e24b86c0d8f33bf1050/64000/64471/64471.mp4/?embed=true&amp;rnd=1653706170566" class="fp-engine" autoplay="" preload="none" x-webkit-airplay="allow" webkit-playsinline="true" playsinline="true"></video> -->
    </div>

    <h2 id="options">Options</h2>
    <div class="example">
		<p>URL:<input type="text" style="width:100%;" id="urlinnput" value="https://cl-sp.clsp-001.com/20220527/33/index.m3u8"></input></p>
		<button class="btn" onclick="reload()">Reload</button>
		<button class="btn" onclick="refreshHistory()">Histroy</button>
        <button class="btn" onclick="switchDPlayer()">Switch Video</button>
        <button class="btn" onclick="dp2.notice('Notice演示')">notice</button>
        <button class="btn" onclick="dp2.seek(120)">seek</button>
        <button class="btn" onclick="dp2.volume(0.2)">volume</button>
        <button class="btn" onclick="dp2.toggle()">toggle</button>
        <button class="btn" onclick="dp2.destroy()">destroy</button>
        <button class="btn" onclick="dp2.danmaku.hide()">danmaku.hide</button>
        <button class="btn" onclick="dp2.danmaku.show()">danmaku.show</button>
        <div id="dplayer2"></div>
        <div id="events"></div>
    </div>

    <h2 id="quality-switching">Quality switching</h2>
    <div class="example">
        <button class="btn" onclick="dp3.switchQuality(1)">Switch quality</button>
        <div id="dplayer3"></div>
    </div>

    <h2 id="hls-support">HLS support</h2>
    <div class="example">
        <div id="dplayer4"></div>
    </div>

    <h2 id="dash-support">MPEG DASH support</h2>
    <div class="example">
        <div id="dplayer8"></div>
    </div>

    <h2 id="flv-support">FLV support</h2>
    <div class="example">
        <div id="dplayer5"></div>
    </div>

    <h2 id="webtorrent">WebTorrent</h2>
    <div class="example">
        <div id="dplayer9"></div>
    </div>

    <h2 id="live">Live</h2>
    <div class="example">
        <button class="btn" onclick="dp6.danmaku.draw({text: '假装收到 WebSocket 弹幕', color: '#fff', type: 'right'})">假装收到 WebSocket 弹幕</button>
        <div id="dplayer6"></div>
    </div>

    <h2 id="custon-type">Custon video type</h2>
    <div class="example">
        <div id="dplayer10"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/stats.js"></script>
    <script src="demo.js"></script>
</div>
<div class="history">
	<button class="btn" onclick="refreshHistory()">Histroy</button>
	<div id="videoplayer">
		<p>Date:<input type="date" style="width:100%;" value="2022-05-16" id="urlinnput1" ></input></p>
		<p>Number:<input type="number" style="width:100%;" id="urlinnput2" value="1" ></input></p>
		<button class="btn" onclick="playVideo()">Play</button>
		<button class="btn" onclick="prepagePlayVideo()">Prevous</button>
		<button class="btn" onclick="nextPlayVideo()">Next</button>
		<button class="btn" onclick="preDayPlayVideo()">Prevous Day</button>
		<button class="btn" onclick="nextDayPlayVideo()">Next Day</button>
		<div class="current-play-url"></div>
	</div>
	<ul id="history" >
	</ul>
</div>
<script type="text/javascript">
			let d = new Date(Date.now()-(24*60*60*1000));
			let m = d.getMonth()+1;
			m = m>9?m:'0'+m;
			let da = d.getDate();
			da = da>9?da:'0'+da;
			var val = '2022-'+m+'-'+da;
			$('#urlinnput1').val(val);
	</script>
</body>

</html>
